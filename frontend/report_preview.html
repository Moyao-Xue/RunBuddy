<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RunBuddy Report Preview</title>
  <link rel="stylesheet" href="css/report_preview.css" />
</head>
<body>
  <main class="preview-page">
    <header class="preview-head">
      <div>
        <p class="preview-kicker">Save Preview</p>
        <h1 class="preview-title">Run Report Image</h1>
      </div>
      <div class="preview-actions">
        <button class="preview-download-btn" type="button" id="downloadBtn">Download Image</button>
        <button class="preview-back-btn" type="button" id="backBtn">Back</button>
      </div>
    </header>

    <p class="preview-note" id="previewNote">
      This page generates one phone-sized image file. If the browser does not save it automatically, tap Download Image again or long-press the image below.
    </p>

    <p class="preview-empty" id="emptyState" hidden>No saved report preview is available.</p>

    <section class="poster-stage" id="posterStage" hidden>
      <img class="poster-image" id="posterImage" alt="RunBuddy report image preview" />
      <a id="downloadLink" hidden>Download</a>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script>
    const backBtn = document.getElementById('backBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewNoteEl = document.getElementById('previewNote');
    const emptyStateEl = document.getElementById('emptyState');
    const posterStageEl = document.getElementById('posterStage');
    const posterImageEl = document.getElementById('posterImage');
    const downloadLinkEl = document.getElementById('downloadLink');

    let activePayload = null;
    let activePosterUrl = null;

    backBtn.addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      window.location.href = 'settling.html';
    });

    downloadBtn.addEventListener('click', () => {
      if (!activePayload || !downloadLinkEl.href) return;
      triggerDownload();
    });

    window.addEventListener('beforeunload', cleanupPosterUrl);

    document.addEventListener('DOMContentLoaded', () => {
      const payload = Storage.getReportPreview();
      if (!payload) {
        emptyStateEl.hidden = false;
        downloadBtn.disabled = true;
        return;
      }

      activePayload = payload;
      const posterUrl = buildPosterObjectUrl(payload);

      posterImageEl.src = posterUrl;
      downloadLinkEl.href = posterUrl;
      downloadLinkEl.download = buildReportFilename(payload);
      posterStageEl.hidden = false;

      const params = new URLSearchParams(window.location.search);
      if (params.get('download') === '1') {
        setTimeout(() => triggerDownload(), 140);
      }
    });

    function triggerDownload() {
      downloadLinkEl.click();
      previewNoteEl.textContent = 'If your browser still saves the page instead of the image, long-press the image itself and choose Save image.';
    }

    function cleanupPosterUrl() {
      if (!activePosterUrl) return;
      URL.revokeObjectURL(activePosterUrl);
      activePosterUrl = null;
    }

    function buildPosterObjectUrl(payload) {
      cleanupPosterUrl();
      const svgMarkup = buildPosterSvg(payload);
      const blob = new Blob([svgMarkup], {
        type: 'image/svg+xml;charset=utf-8'
      });
      activePosterUrl = URL.createObjectURL(blob);
      return activePosterUrl;
    }

    function buildReportFilename(payload) {
      const date = new Date(payload && payload.timestamp ? payload.timestamp : Date.now());
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `runbuddy-report-${year}${month}${day}-${hours}${minutes}.svg`;
    }

    function buildPosterSvg(payload) {
      const title = escapeXml(payload.title || 'Run Summary');
      const completionTitle = escapeXml(payload.completionTitle || 'Complete!');
      const streakLines = buildSvgTextLines(payload.streakText || 'You have kept running for 100 days', 20);
      const coinsText = escapeXml(payload.coinsText || '0 coins collected!');
      const summaryDate = escapeXml(payload.summaryDate || '--');
      const summaryDistance = escapeXml(payload.summaryDistance || '--');
      const summaryPace = escapeXml(payload.summaryPace || '--');
      const summaryDuration = escapeXml(payload.summaryDuration || '--');
      const summaryCalories = escapeXml(payload.summaryCalories || '--');
      const weatherLabel = escapeXml(payload.weatherLabel || '--');
      const weatherDetailLines = buildSvgTextLines(payload.weatherDetail || 'Real-time conditions', 24);
      const runnerHref = escapeXml(resolveAssetUrl(payload.runnerImage || 'images/character.png'));
      const weatherHref = escapeXml(resolveAssetUrl(payload.weatherIcon || 'images/weather.png'));
      const routeSvg = buildRouteSvg(payload.routePoints || [], {
        x: 0,
        y: 0,
        width: 321,
        height: 172
      });

      return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852" role="img" aria-label="RunBuddy report image">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d8b1" />
      <stop offset="100%" stop-color="#ecd1a8" />
    </linearGradient>
    <linearGradient id="summaryBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#abd6e8" />
      <stop offset="100%" stop-color="#9fccdf" />
    </linearGradient>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9ee" />
      <stop offset="100%" stop-color="#f7f1e4" />
    </linearGradient>
    <linearGradient id="weatherBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef7ff" />
      <stop offset="100%" stop-color="#dff0ff" />
    </linearGradient>
    <linearGradient id="routeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f8" />
      <stop offset="100%" stop-color="#e0e7ee" />
    </linearGradient>
    <pattern id="routeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1.4" />
    </pattern>
  </defs>

  <rect width="393" height="852" fill="url(#pageBg)" />

  <text x="196.5" y="34" text-anchor="middle" fill="#7d6759" font-size="14" font-family="Arial, sans-serif" letter-spacing="2.5">${title}</text>
  <text x="196.5" y="86" text-anchor="middle" fill="#78444d" font-size="52" font-family="Arial, sans-serif" font-weight="700">${completionTitle}</text>

  <rect x="14" y="118" width="365" height="646" rx="12" fill="url(#summaryBg)" stroke="#000000" stroke-width="2" />
  <rect x="327" y="128" width="42" height="28" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="348" y="147" text-anchor="middle" fill="#111111" font-size="18" font-family="Arial, sans-serif" font-weight="700">...</text>

  <rect x="26" y="164" width="341" height="220" rx="10" fill="#fbfdff" stroke="#000000" stroke-width="2" />
  <rect x="36" y="174" width="112" height="200" rx="10" fill="url(#heroBg)" stroke="#000000" stroke-width="2" />
  <image href="${runnerHref}" x="48" y="182" width="88" height="118" preserveAspectRatio="xMidYMid meet" />
  <text x="48" y="314" fill="#171717" font-size="12" font-family="Arial, sans-serif" font-weight="600">
    ${streakLines.map((line, index) => `<tspan x="48" dy="${index === 0 ? 0 : 15}">${line}</tspan>`).join('')}
  </text>
  <rect x="48" y="340" width="88" height="28" rx="14" fill="#fff0cb" stroke="#000000" stroke-width="2" />
  <text x="92" y="358.5" text-anchor="middle" fill="#78444d" font-size="11" font-family="Arial, sans-serif" font-weight="700">${coinsText}</text>

  ${buildStatCardSvg(156, 174, 203, 54, 'Date', summaryDate, 14)}
  ${buildStatCardSvg(156, 235, 97, 68, 'Distance', summaryDistance, 16)}
  ${buildStatCardSvg(262, 235, 97, 68, 'Pace', summaryPace, 16)}
  ${buildStatCardSvg(156, 311, 97, 68, 'Duration', summaryDuration, 16)}
  ${buildStatCardSvg(262, 311, 97, 68, 'Calories', summaryCalories, 16)}

  <rect x="156" y="386" width="203" height="74" rx="10" fill="url(#weatherBg)" stroke="#000000" stroke-width="2" />
  <text x="168" y="402" fill="#4b5563" font-size="10" font-family="Arial, sans-serif" font-weight="600" letter-spacing="1.2">WEATHER</text>
  <text x="168" y="424" fill="#171717" font-size="16" font-family="Arial, sans-serif" font-weight="700">${weatherLabel}</text>
  <text x="168" y="441" fill="#4b5563" font-size="10" font-family="Arial, sans-serif" font-weight="500">
    ${weatherDetailLines.map((line, index) => `<tspan x="168" dy="${index === 0 ? 0 : 12}">${line}</tspan>`).join('')}
  </text>
  <image href="${weatherHref}" x="304" y="395" width="42" height="42" preserveAspectRatio="xMidYMid slice" />

  <rect x="26" y="392" width="341" height="286" rx="10" fill="#f2f6fa" stroke="#000000" stroke-width="2" />
  <text x="38" y="412" fill="#5b6776" font-size="11" font-family="Arial, sans-serif" font-weight="600" letter-spacing="1.2">MOVEMENT RECORD</text>
  <text x="38" y="438" fill="#78444d" font-size="18" font-family="Arial, sans-serif" font-weight="700">This Run Route</text>
  <text x="355" y="424" text-anchor="end" fill="#4b5563" font-size="10" font-family="Arial, sans-serif" font-weight="500">Single-run path</text>

  <g transform="translate(36 452)">
    <rect width="321" height="172" rx="10" fill="url(#routeBg)" />
    <rect width="321" height="172" rx="10" fill="url(#routeGrid)" />
    ${routeSvg}
    <g transform="translate(10 136)">
      ${buildLegendChipSvg(0, 0, 'Start', '#4b9cf5')}
      ${buildLegendChipSvg(102, 0, 'Finish', '#f08a2d')}
    </g>
  </g>

  <rect x="24" y="776" width="345" height="54" rx="10" fill="#9fccdf" stroke="#000000" stroke-width="2" />
  <text x="196.5" y="811" text-anchor="middle" fill="#111111" font-size="23" font-family="Arial, sans-serif" font-weight="700">Back To Home</text>
</svg>`;
    }

    function buildStatCardSvg(x, y, width, height, label, value, valueSize) {
      return `
        <rect x="${x}" y="${y}" width="${width}" height="${height}" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="${x + 10}" y="${y + 14}" fill="#4b5563" font-size="10" font-family="Arial, sans-serif" font-weight="600" letter-spacing="1">${escapeXml(label.toUpperCase())}</text>
        <text x="${x + 10}" y="${y + 38}" fill="#171717" font-size="${valueSize}" font-family="Arial, sans-serif" font-weight="700">${escapeXml(value)}</text>
      `;
    }

    function buildRouteSvg(routePoints, box) {
      const latLngs = normalizeRoutePoints(routePoints);
      if (latLngs.length < 2) {
        return `
          <text x="${box.width / 2}" y="${box.height / 2}" text-anchor="middle" fill="#5b6776" font-size="12" font-family="Arial, sans-serif" font-weight="600">
            No route data available for this run.
          </text>
        `;
      }

      const padding = 18;
      const projected = latLngs.map(([lat, lng]) => ({
        x: lng,
        y: Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2))
      }));

      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;

      projected.forEach((point) => {
        minX = Math.min(minX, point.x);
        maxX = Math.max(maxX, point.x);
        minY = Math.min(minY, point.y);
        maxY = Math.max(maxY, point.y);
      });

      const spanX = Math.max(maxX - minX, 0.000001);
      const spanY = Math.max(maxY - minY, 0.000001);
      const scale = Math.min((box.width - padding * 2) / spanX, (box.height - padding * 2) / spanY);
      const offsetX = (box.width - spanX * scale) / 2;
      const offsetY = (box.height - spanY * scale) / 2;

      const normalized = projected.map((point) => ({
        x: (point.x - minX) * scale + offsetX,
        y: (maxY - point.y) * scale + offsetY
      }));

      const points = normalized.map((point) => `${point.x},${point.y}`).join(' ');
      const start = normalized[0];
      const finish = normalized[normalized.length - 1];

      return `
        <polyline points="${points}" fill="none" stroke="#2577d9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="${start.x}" cy="${start.y}" r="5" fill="#4b9cf5" stroke="#ffffff" stroke-width="2" />
        <circle cx="${finish.x}" cy="${finish.y}" r="5" fill="#f08a2d" stroke="#ffffff" stroke-width="2" />
      `;
    }

    function buildLegendChipSvg(x, y, label, dotColor) {
      return `
        <g transform="translate(${x} ${y})">
          <rect width="92" height="24" rx="12" fill="rgba(255,255,255,0.94)" stroke="#000000" stroke-width="1.5" />
          <circle cx="14" cy="12" r="4.5" fill="${dotColor}" stroke="#ffffff" stroke-width="1.2" />
          <text x="24" y="16" fill="#171717" font-size="10" font-family="Arial, sans-serif" font-weight="600">${escapeXml(label)}</text>
        </g>
      `;
    }

    function buildSvgTextLines(text, maxChars) {
      const words = String(text || '').split(/\s+/).filter(Boolean);
      if (words.length === 0) return [''];

      const lines = [];
      let current = '';

      words.forEach((word) => {
        const next = current ? `${current} ${word}` : word;
        if (next.length > maxChars && current) {
          lines.push(escapeXml(current));
          current = word;
        } else {
          current = next;
        }
      });

      if (current) {
        lines.push(escapeXml(current));
      }

      return lines.slice(0, 3);
    }

    function normalizeRoutePoints(routePoints) {
      if (!Array.isArray(routePoints)) return [];

      return routePoints
        .filter((point) => point && typeof point.lat === 'number' && typeof point.lng === 'number')
        .map((point) => [point.lat, point.lng]);
    }

    function resolveAssetUrl(src) {
      try {
        return new URL(src, window.location.href).href;
      } catch (error) {
        return src;
      }
    }

    function escapeXml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }
  </script>
</body>
</html>
