<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunBuddy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        .phone-container {
            position: relative;
            width: 393px;
            height: 852px;
            overflow: hidden;
            border: none;
            border-radius: 0;
            background: #f4ebd3;
        }

        .page-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .top-strip,
        .bottom-strip {
            position: absolute;
            background: #9fcce0;
            z-index: 1;
        }

        .top-strip {
            top: 0;
            left: 0;
            right: 0;
            width: auto;
            height: 62px;
            transform: none;
            z-index: 10;
        }

        .bottom-strip {
            bottom: 0;
            left: 0;
            right: 0;
            height: 74px;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 143px 15px 90px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: calc(100% - 200px);
            overflow-y: auto;
        }

        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .video-panel {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
            flex: 1;
        }

        .video-panel iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            font-size: 10px;
            padding: 20px 5px 5px;
            text-align: center;
            pointer-events: none;
        }

        .back-button {
            position: absolute;
            top: 60px;
            right: 27px;
            z-index: 20;
            width: 39px;
            height: 39px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .back-button img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <img src="images/iphone-17-61-2@2x.png" alt="RunBuddy page background" class="page-bg">
        <div class="top-strip"></div>
        <div class="bottom-strip"></div>

        <button class="back-button" onclick="location.href='iphone17-34.html'" aria-label="Back to professional guidance">
            <img src="images/close-up-default@2x.png" alt="">
        </button>

        <div class="content">
            <div class="video-grid">
                <div class="video-panel">
                    <iframe 
                        src="https://player.bilibili.com/player.html?bvid=BV13L4y1u7fz&page=1&autoplay=0"
                        scrolling="no" 
                        allowfullscreen="true">
                    </iframe>
                    <div class="video-title">跑步教学视频 1</div>
                </div>
                <div class="video-panel">
                    <iframe 
                        src="https://player.bilibili.com/player.html?bvid=BV1nHHeeVEYj&page=1&autoplay=0"
                        scrolling="no" 
                        allowfullscreen="true">
                    </iframe>
                    <div class="video-title">短跑专项练习课程</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
