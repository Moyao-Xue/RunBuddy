<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunBuddy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        .phone-container {
            position: relative;
            width: 393px;
            height: 852px;
            overflow: hidden;
            border: none;
            border-radius: 0;
            background: #f4ebd3;
        }

        .page-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            position: absolute;
            top: 82px;
            left: 0;
            right: 0;
            bottom: 24px;
            z-index: 2;
            padding: 61px 15px 90px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .video-panel {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
            flex: 0 0 auto;
        }

        .video-panel iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            font-size: 10px;
            padding: 20px 5px 5px;
            text-align: center;
            pointer-events: none;
        }

        .back-button {
            position: absolute;
            top: 16px;
            right: 12px;
            z-index: 20;
            width: 57px;
            height: 57px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .back-button img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <img src="images/iphone-17-61-2@2x.png" alt="RunBuddy page background" class="page-bg">

        <button class="back-button" onclick="location.href='shouye.html'" aria-label="Back to home">
            <img src="images/close-up-default@2x.png" alt="">
        </button>

        <div class="content">
            <div class="video-grid">
                <div class="video-panel">
                    <iframe 
                        src="https://player.bilibili.com/player.html?bvid=BV13L4y1u7fz&page=1&autoplay=0"
                        scrolling="no" 
                        allowfullscreen="true">
                    </iframe>
                    <div class="video-title">跑步教学视频 1</div>
                </div>
                <div class="video-panel">
                    <iframe 
                        src="https://player.bilibili.com/player.html?bvid=BV1nHHeeVEYj&page=1&autoplay=0"
                        scrolling="no" 
                        allowfullscreen="true">
                    </iframe>
                    <div class="video-title">短跑专项练习课程</div>
                </div>
                <div class="video-panel">
                    <iframe
                        src="https://player.bilibili.com/player.html?bvid=BV1UN411n73K&page=1&autoplay=0"
                        scrolling="no"
                        allowfullscreen="true">
                    </iframe>
                    <div class="video-title">Healthy Running: Knee-Friendly Form</div>
                </div>
                <div class="video-panel">
                    <iframe
                        src="https://player.bilibili.com/player.html?bvid=BV1HV411d71N&page=1&autoplay=0"
                        scrolling="no"
                        allowfullscreen="true">
                    </iframe>
                    <div class="video-title">Beginner Running Form in 3 Minutes</div>
                </div>
                <div class="video-panel">
                    <iframe
                        src="https://player.bilibili.com/player.html?bvid=BV1qA411E7Ug&page=1&autoplay=0"
                        scrolling="no"
                        allowfullscreen="true">
                    </iframe>
                    <div class="video-title">Running Knee Pain Check</div>
                </div>
                <div class="video-panel">
                    <iframe
                        src="https://player.bilibili.com/player.html?bvid=BV1MgG3zbESx&page=1&autoplay=0"
                        scrolling="no"
                        allowfullscreen="true">
                    </iframe>
                    <div class="video-title">8-Minute Easy Slow Jog</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
