<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share - RunBuddy</title>
    <link href="https://fonts.googleapis.com/css?family=Pixelify+Sans:400,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pages/run-share.css" />
</head>
<body>
    <div class="phone">
        <img class="bg" src="images/iphone-17-61-2@2x.png" alt="">
        <div class="top-strip"></div>

        <button class="back-button" onclick="location.href='run-summary.html'" aria-label="Go back">
            <img src="images/vector.svg" alt="">
        </button>

        <div class="share-card">
            <div class="share-title">Share to</div>
            <div class="social-grid">
                <div class="social-item" onclick="shareTo('wechat')">
                    <div class="social-icon wechat"></div>
                    <span class="social-name">WeChat</span>
                </div>
                <div class="social-item" onclick="shareTo('weibo')">
                    <div class="social-icon weibo"></div>
                    <span class="social-name">Weibo</span>
                </div>
                <div class="social-item" onclick="shareTo('qq')">
                    <div class="social-icon qq"></div>
                    <span class="social-name">QQ</span>
                </div>
                <div class="social-item" onclick="shareTo('moments')">
                    <div class="social-icon moments"></div>
                    <span class="social-name">Moments</span>
                </div>
                <div class="social-item" onclick="shareTo('whatsapp')">
                    <div class="social-icon whatsapp"></div>
                    <span class="social-name">WhatsApp</span>
                </div>
                <div class="social-item" onclick="shareTo('tiktok')">
                    <div class="social-icon tiktok"></div>
                    <span class="social-name">TikTok</span>
                </div>
            </div>
        </div>

        <div class="record-card">
            <div class="record-title">Your Running Record</div>
            <div class="record-stats">
                <div class="stat-item">
                    <div class="stat-value">5.20</div>
                    <div class="stat-label">Distance (KM)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">32:15</div>
                    <div class="stat-label">Duration</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">6'12"</div>
                    <div class="stat-label">Pace /KM</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">245</div>
                    <div class="stat-label">Calories (Kcal)</div>
                </div>
            </div>
        </div>

        <button class="copy-link-btn" onclick="copyLink()">Copy Link</button>
        <div class="toast" id="toast">Link copied!</div>
        <div class="bottom-bar"></div>
    </div>

    <script src="js/pages/run-share.js"></script>
</body>
</html>
