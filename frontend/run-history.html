<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunBuddy - Running History</title>
    <link rel="stylesheet" href="css/pages/run-history.css" />
</head>
<body>
    <div class="phone-container">
        <img class="bg" src="images/iphone-17-61-2@2x.png" alt="" aria-hidden="true">
        <!-- Top navigation -->
        <div class="header">
            <h1 class="header-title">My Runs</h1>
            <button class="btn-back" type="button" aria-label="Back to home">
                <img src="images/pointer-left.svg" alt="">
            </button>
        </div>

        <!-- Summary stats -->
        <div class="stats-summary">
            <div class="stat-box">
                <div class="stat-value" id="totalRuns">0</div>
                <div class="stat-label">Total Runs</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="totalDistance">0</div>
                <div class="stat-label">Kilometers</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="totalCalories">0</div>
                <div class="stat-label">Calories</div>
            </div>
        </div>

        <!-- Coin stats -->
        <div class="stats-summary" style="top: 200px;">
            <div class="stat-box">
                <div class="stat-value" id="totalCoins">0</div>
                <div class="stat-label">Total Coins</div>
            </div>
        </div>

        <!-- Scrollable history list -->
        <div class="scroll-container" id="historyList">
            <div class="section-title">Recent Activities</div>
            <!-- Records will be dynamically inserted here -->
        </div>

        <!-- Bottom button -->
        <button class="bottom-button" type="button">Monthly Check-in</button>
    </div>

    <!-- LocalStorage utility module -->
    <script src="js/storage.js"></script>
    <script src="js/pages/run-history.js"></script>
</body>
</html>
