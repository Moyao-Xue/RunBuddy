<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Pixelify+Sans:400,600&display=swap" rel="stylesheet">
    <title>RunBuddy - Customize</title>
        <link rel="stylesheet" href="css/pages/pants-shop.css" />
</head>
<body>
    <div class="phone-container">
        <!-- Coin Display -->
        <div class="coin-display">
            <img src="images/coin.png" alt="Coin" class="coin-icon">
            <span class="coin-count" id="coinCount">0</span>
        </div>

        <!-- Notification -->
        <div class="notification" id="notification"></div>
        <img src="images/iPhone 17 - 30.png" alt="Customize Page" class="page-bg">

        <div class="top-right-actions" aria-label="Top right actions">
            <a href="wardrobe-overview.html" class="top-right-action" aria-label="Go to iPhone 17 - 31 page">
                <img src="images/Group 125.png" alt="Go to iPhone 17 - 31 page">
            </a>
            <a href="character-customization.html" class="top-right-action" aria-label="Back to customize">
                <img src="images/Group 119 (1).png" alt="Back to customize">
            </a>
        </div>
    </div>

    <!-- Buy Button -->
    <button class="buy-btn" id="buyBtn">Buy - 40 Coins</button>

    <script src="js/storage.js"></script>
        <script src="js/pages/pants-shop.js"></script>
</body>
</html>
